cargo-features = ["per-package-target"]

[workspace]
members = [
    "lib/interfaces",
    "lib/logic",
    "bin/embedded",
    "bin/pc"
]
resolver = "3"

[workspace.dependencies]
interfaces = { path = "lib/interfaces" }
logic = { path = "lib/logic" }
postcard = { version = "=1.1.3", default-features = false, features = ["heapless", "heapless-cas"] }